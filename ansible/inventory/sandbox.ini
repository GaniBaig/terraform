# Vault ACI Sandbox — Ansible Inventory
# Replace the placeholder IPs with actual ACI VM IPs once provisioned via ServiceNow
# Existing sandbox node IPs for reference: .31 / .32 / .33 (subnet 10.184.32.0/22)

[vault_nodes]
vault-aci-01  ansible_host=10.184.32.TBD1  node_id=node_1
vault-aci-02  ansible_host=10.184.32.TBD2  node_id=node_2
vault-aci-03  ansible_host=10.184.32.TBD3  node_id=node_3

[vault_nodes:vars]
ansible_user=vault
ansible_ssh_private_key_file=~/.ssh/id_rsa
ansible_python_interpreter=/usr/bin/python3
