---
# Vault ACI Sandbox — master playbook
# Deploys HashiCorp Vault OSS v1.21+ onto all 3 ACI nodes
#
# Usage:
#   Dry run (check mode):
#     ansible-playbook -i ansible/inventory/sandbox.ini ansible/site.yml --check
#
#   Live deploy:
#     ansible-playbook -i ansible/inventory/sandbox.ini ansible/site.yml

- name: Deploy Vault ACI cluster
  hosts: vault_nodes
  become: true
  gather_facts: true

  roles:
    - role: vault
